<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gibbs Sampler - Visualización Interactiva</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.26.0/plotly.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 350px 1fr;
            min-height: 800px;
        }
        
        .sidebar {
            background: #f8f9fa;
            padding: 30px;
            border-right: 1px solid #dee2e6;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }
        
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #3498db;
        }
        
        .bounds-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .btn {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
            margin-top: 10px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(52, 152, 219, 0.3);
        }
        
        .btn:disabled {
            background: #bdc3c7;
            transform: none;
            box-shadow: none;
            cursor: not-allowed;
        }
        
        .btn-validate {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            margin-bottom: 10px;
        }
        
        .btn-validate:hover {
            box-shadow: 0 8px 25px rgba(46, 204, 113, 0.3);
        }
        
        .status {
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-weight: 500;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f1aeb5;
        }
        
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .visualization-area {
            padding: 30px;
            background: white;
        }
        
        /* --- CAMBIO DE ESTILO: Las pestañas ahora son encabezados --- */
        .section-header {
            padding: 15px 25px;
            font-weight: 600;
            color: #2c3e50;
            font-size: 1.2em;
            border-bottom: 2px solid #e9ecef;
            margin-bottom: 20px;
        }

        .plot-container, .stats-grid {
            margin-bottom: 30px; /* Espacio entre cada sección */
        }
        
        .plot-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            padding: 20px;
            height: 600px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        
        .stat-label {
            color: #6c757d;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .examples {
            margin-top: 20px;
        }
        
        .example-item {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .example-item:hover {
            border-color: #3498db;
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.1);
        }
        
        .example-name {
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        
        .example-desc {
            font-size: 0.9em;
            color: #6c757d;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 50px;
            color: #6c757d;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔬 Gibbs Sampler</h1>
            <p>Muestreador analítico con validación automática</p>
        </div>
        
        <div class="main-content">
            <div class="sidebar">
                <div class="form-group">
                    <label for="expression">Función f(x,y):</label>
                    <input type="text" id="expression" placeholder="Ej: (2*x + 3*y + 2)/28" value="(2*x + 3*y + 2)/28">
                </div>
                
                <div class="form-group">
                    <label>Límites del dominio:</label>
                    <div class="bounds-grid">
                        <input type="number" id="x_min" placeholder="x_min" value="0" step="0.1">
                        <input type="number" id="x_max" placeholder="x_max" value="2" step="0.1">
                        <input type="number" id="y_min" placeholder="y_min" value="0" step="0.1">
                        <input type="number" id="y_max" placeholder="y_max" value="2" step="0.1">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Valores iniciales (opcional):</label>
                    <div class="bounds-grid">
                        <input type="number" id="x_init" placeholder="x_inicial" step="0.1">
                        <input type="number" id="y_init" placeholder="y_inicial" step="0.1">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="n_samples">Número de muestras:</label>
                    <input type="number" id="n_samples" value="1000" min="100" max="10000" step="100">
                </div>
                
                <div class="form-group">
                    <label for="burn_in">Burn-in:</label>
                    <input type="number" id="burn_in" value="500" min="0" max="5000" step="100">
                </div>
                
                <button class="btn btn-validate" onclick="validateFunction()">🔍 Validar Función</button>
                <button class="btn" id="sampleBtn" onclick="runSampling()" disabled>🚀 Ejecutar Muestreo</button>
                
                <div id="status"></div>
                
                <div class="examples">
                    <h3>📋 Ejemplos:</h3>
                    <div class="example-item" onclick="loadExample(0)">
                        <div class="example-name">Distribución Lineal</div>
                        <div class="example-desc">Función: (2*x + 3*y + 2)/28</div>
                    </div>
                    <div class="example-item" onclick="loadExample(1)">
                        <div class="example-name">Distribución Cuadrática</div>
                        <div class="example-desc">Función: (x**2 + y**2 + 1)/21</div>
                    </div>
                    <div class="example-item" onclick="loadExample(2)">
                        <div class="example-name">Distribución Mixta</div>
                        <div class="example-desc">Función: (x + 2*y**2 + 3)/15</div>
                    </div>
                </div>
            </div>
            
            <div class="visualization-area">
                <div class="section-header">📊 Vista 2D</div>
                <div id="plot-scatter" class="plot-container"></div>
                
                <div class="section-header">📈 Histograma 3D</div>
                <div id="plot-histogram" class="plot-container"></div>
                
                <div class="section-header">📋 Estadísticas</div>
                <div id="stats-panel" class="stats-grid"></div>

                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>Procesando muestras...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://gibbs-zvyw.onrender.com/';
        let currentData = null;
        let examples = [];
        
        async function loadExamples() {
            try {
                const response = await fetch(`${API_BASE}/examples`);
                const data = await response.json();
                examples = data.examples;
            } catch (error) {
                console.error('Error cargando ejemplos:', error);
            }
        }
        
        function loadExample(index) {
            const example = examples[index];
            if (!example) return;
            document.getElementById('expression').value = example.expression;
            document.getElementById('x_min').value = example.bounds.x_min;
            document.getElementById('x_max').value = example.bounds.x_max;
            document.getElementById('y_min').value = example.bounds.y_min;
            document.getElementById('y_max').value = example.bounds.y_max;
            document.getElementById('x_init').value = '';
            document.getElementById('y_init').value = '';
            document.getElementById('status').innerHTML = '';
            document.getElementById('sampleBtn').disabled = true;
        }
        
        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = `<div class="status ${type}">${message}</div>`;
        }
        
        async function validateFunction() {
            const requestData = getFormData();
            try {
                showStatus('🔍 Validando función...', 'info');
                const response = await fetch(`${API_BASE}/validate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestData),
                    mode: 'cors'
                });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                const result = await response.json();
                if (result.is_valid) {
                    showStatus('✅ Función válida! Se puede usar el método analítico.', 'success');
                    document.getElementById('sampleBtn').disabled = false;
                } else {
                    const errors = result.errors.join('<br>• ');
                    showStatus(`❌ Errores encontrados:<br>• ${errors}`, 'error');
                    document.getElementById('sampleBtn').disabled = true;
                }
            } catch (error) {
                console.error('Error en validación:', error);
                showStatus(`❌ Error de conexión: ${error.message}`, 'error');
                document.getElementById('sampleBtn').disabled = true;
            }
        }
        
        function getFormData() {
            return {
                expression: document.getElementById('expression').value,
                x_min: parseFloat(document.getElementById('x_min').value),
                x_max: parseFloat(document.getElementById('x_max').value),
                y_min: parseFloat(document.getElementById('y_min').value),
                y_max: parseFloat(document.getElementById('y_max').value),
                x_initial: document.getElementById('x_init').value ? parseFloat(document.getElementById('x_init').value) : null,
                y_initial: document.getElementById('y_init').value ? parseFloat(document.getElementById('y_init').value) : null,
                n_samples: parseInt(document.getElementById('n_samples').value),
                burn_in: parseInt(document.getElementById('burn_in').value)
            };
        }
        
        async function runSampling() {
            const requestData = getFormData();
            try {
                document.getElementById('loading').style.display = 'block';
                showStatus('🚀 Ejecutando muestreador de Gibbs...', 'info');
                
                const response = await fetch(`${API_BASE}/sample`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestData),
                    mode: 'cors'
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }
                
                const result = await response.json();
                
                if (result.success) {
                    currentData = result;
                    showStatus(`✅ Muestreo completado en ${result.execution_time.toFixed(3)}s. ${result.statistics.total_samples} muestras generadas.`, 'success');
                    
                    if (!result.plot_data) {
                        showStatus('❌ Error: No se generaron datos para graficar', 'error');
                        return;
                    }
                    
                    // --- CAMBIO #1: YA NO SE LLAMA A showTab ---
                    // Simplemente creamos las gráficas y actualizamos las estadísticas
                    await createScatterPlot();
                    await createHistogram3D();
                    updateStatistics();
                    
                } else {
                    const errors = result.validation?.errors?.join('<br>• ') || 'Error desconocido';
                    showStatus(`❌ Error durante el muestreo:<br>• ${errors}`, 'error');
                }
            } catch (error) {
                console.error('Error completo:', error);
                showStatus(`❌ Error de conexión: ${error.message}`, 'error');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }
        
        function createScatterPlot() {
            if (!currentData || !currentData.plot_data) return Promise.reject('No hay datos');
            const data = [currentData.plot_data.scatter_2d];
            const layout = { ...currentData.plot_data.layout_2d, height: 550, margin: { t: 50, r: 50, b: 50, l: 50 }, plot_bgcolor: 'rgba(240,240,240,0.5)', paper_bgcolor: 'white', font: { family: 'Segoe UI, sans-serif' } };
            const config = { displayModeBar: true, displaylogo: false, responsive: true, modeBarButtonsToRemove: ['pan2d', 'lasso2d', 'select2d'] };
            return Plotly.newPlot('plot-scatter', data, layout, config);
        }
        
        function createHistogram3D() {
            if (!currentData || !currentData.plot_data) return Promise.reject('No hay datos');
            const data = [currentData.plot_data.histogram_3d];
            const layout = { ...currentData.plot_data.layout_3d, height: 550, margin: { t: 50, r: 50, b: 50, l: 50 }, paper_bgcolor: 'white', font: { family: 'Segoe UI, sans-serif' } };
            const config = { displayModeBar: true, displaylogo: false, responsive: true, modeBarButtonsToRemove: ['pan3d'] };
            return Plotly.newPlot('plot-histogram', data, layout, config);
        }
        
        function updateStatistics() {
            if (!currentData || !currentData.statistics) return;
            const stats = currentData.statistics;
            document.getElementById('stats-panel').innerHTML = `
                <div class="stat-card"><div class="stat-value">${stats.mean_x.toFixed(4)}</div><div class="stat-label">Media X</div></div>
                <div class="stat-card"><div class="stat-value">${stats.mean_y.toFixed(4)}</div><div class="stat-label">Media Y</div></div>
                <div class="stat-card"><div class="stat-value">${stats.std_x.toFixed(4)}</div><div class="stat-label">Desv. Std X</div></div>
                <div class="stat-card"><div class="stat-value">${stats.std_y.toFixed(4)}</div><div class="stat-label">Desv. Std Y</div></div>
                <div class="stat-card"><div class="stat-value">${stats.correlation.toFixed(4)}</div><div class="stat-label">Correlación</div></div>
                <div class="stat-card"><div class="stat-value">${stats.total_samples}</div><div class="stat-label">Muestras</div></div>
                <div class="stat-card"><div class="stat-value">${(stats.execution_time * 1000).toFixed(1)}ms</div><div class="stat-label">Tiempo Ejecución</div></div>
                <div class="stat-card"><div class="stat-value">${(stats.total_samples / stats.execution_time).toFixed(0)}</div><div class="stat-label">Muestras/seg</div></div>
            `;
        }
        
        // --- CAMBIO #2: La función showTab y sus listeners han sido eliminados ---
        
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('🚀 Iniciando aplicación...');
            await loadExamples();
            
            // Se eliminó el listener de los clicks en las pestañas
            
            document.getElementById('expression').addEventListener('input', function() {
                document.getElementById('sampleBtn').disabled = true;
                document.getElementById('status').innerHTML = '';
            });
            
            document.querySelectorAll('input').forEach(input => {
                input.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') validateFunction();
                });
            });
            
            console.log('✅ Aplicación inicializada');
        });
        
        function downloadData() {
            if (!currentData || !currentData.samples) {
                alert('No hay datos para descargar');
                return;
            }
            const csvContent = ['x,y', ...currentData.samples.x.map((x, i) => `${x},${currentData.samples.y[i]}`)].join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'gibbs_samples.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        }
        
        function addDownloadButton() {
            const sidebar = document.querySelector('.sidebar');
            const downloadBtn = document.createElement('button');
            downloadBtn.className = 'btn';
            downloadBtn.innerHTML = '💾 Descargar Datos';
            downloadBtn.onclick = downloadData;
            downloadBtn.style.marginTop = '10px';
            downloadBtn.style.background = 'linear-gradient(135deg, #8e44ad, #9b59b6)';
            sidebar.appendChild(downloadBtn);
        }
        
        document.addEventListener('DOMContentLoaded', addDownloadButton);
    </script>
</body>

</html>
